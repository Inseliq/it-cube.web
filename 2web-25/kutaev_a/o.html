<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Snow Falling Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            overflow-x: hidden;
        }

        .snow-container {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1000;
            pointer-events: none;
        }

        .snowflake {
            position: absolute;
            color: #fff;
            animation-name: snowfall;
            animation-duration: 10s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            opacity: 0.7;
        }

        .snowflake:nth-child(odd) {
            transform: rotateZ(-3deg);
        }

        .snowflake:nth-child(even) {
            transform: rotateZ(3deg);
        }

        @keyframes snowfall {
            from {transform: translateY(0);}
            to   {transform: translateY(100vh);}
        }

        .snowflake:nth-of-type(1) {animation-duration: 5s;}
        .snowflake:nth-of-type(2) {left: 10%; animation-duration: 7s;}
        .snowflake:nth-of-type(3) {right: 20%; animation-duration: 6s;}
        .snowflake:nth-of-type(4) {top: 30%; animation-duration: 8s;}
        .snowflake:nth-of-type(5) {bottom: 40%; animation-duration: 9s;}
        .snowflake:nth-of-type(6) {left: 50%; animation-duration: 10s;}
        .snowflake:nth-of-type(7) {right: 60%; animation-duration: 11s;}
        .snowflake:nth-of-type(8) {top: 70%; animation-duration: 12s;}
        .snowflake:nth-of-type(9) {bottom: 80%; animation-duration: 13s;}
        .snowflake:nth-of-type(10){left: 90%; animation-duration: 14s;}
    </style>
</head>
<body>
    <div class="snow-container">
        <span class="snowflake">❄️</span>
        <span class="snowflake">❄️</span>
        <span class="snowflake">❄️</span>
        <span class="snowflake">❄️</span>
        <span class="snowflake">❄️</span>
        <span class="snowflake">❄️</span>
        <span class="snowflake">❄️</span>
        <span class="snowflake">❄️</span>
        <span class="snowflake">❄️</span>
        <span class="snowflake">❄️</span>
    </div>
</body>
</html>
